<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>구모메모</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/paper.css">
<link rel="stylesheet" href="css/list.css">
</head>
<body>

<!-- 목록 화면 -->
<div id="screen-list" class="screen active">

  <!-- 검색바 (숨김 상태로 시작) -->
  <div id="search-bar" class="search-bar hidden">
    <input id="search-input" type="search" placeholder="메모 검색..."
           oninput="List.search(this.value)" autocomplete="off">
    <button onclick="List.closeSearch()">✕</button>
  </div>

  <div id="note-list" class="note-list"></div>

  <!-- 바텀바 -->
  <div id="bottom-bar" class="bottom-bar">
    <button class="bb-btn" onclick="Editor.openNew()">✏</button>
    <button class="bb-btn" onclick="List.toggleSearch()">🔍</button>
    <button class="bb-btn" onclick="UI.openMoreMenu()">⋮</button>
  </div>
</div>

<!-- 에디터 화면 -->
<div id="screen-editor" class="screen">
  <header class="editor-header">
    <button class="btn-back" onclick="Editor.save()">← 저장</button>
    <div class="editor-tools">
      <button class="btn-tool" onclick="Editor.cyclePaper()" id="btn-paper">▤ 줄</button>
      <button class="btn-tool" onclick="UI.openFontPanel()">A</button>
      <button class="btn-tool" onclick="UI.openTagPanel()">🏷</button>
      <button class="btn-tool" onclick="Editor.pickImage()">🖼</button>
    </div>
  </header>

  <div id="editor-scroll" class="editor-scroll">
    <input id="note-title" class="note-title-input" placeholder="제목 (선택사항)" type="text">
    <div id="note-content" class="note-content paper-lined" contenteditable="true" spellcheck="false"></div>
    <div id="note-images" class="note-images"></div>
  </div>
</div>

<!-- 설정 패널 -->
<div id="panel-settings" class="panel hidden">
  <div class="panel-header"><span>설정</span><button onclick="UI.closePanel('panel-settings')">✕</button></div>
  <div class="panel-body">
    <label>에디터 폰트 크기</label>
    <div class="font-size-row">
      <input type="range" min="12" max="24" step="1" id="setting-font-size"
             oninput="Settings.setFontSize(this.value)" onchange="Settings.setFontSize(this.value)">
      <span id="setting-font-size-label">16px</span>
    </div>
    <label>기본 용지</label>
    <select id="setting-paper" onchange="Settings.setPaper(this.value)">
      <option value="lined">줄노트</option>
      <option value="grid">격자</option>
      <option value="blank">무선</option>
    </select>
  </div>
</div>

<!-- 태그 관리 패널 -->
<div id="panel-tags" class="panel hidden">
  <div class="panel-header"><span>태그 관리</span><button onclick="UI.closePanel('panel-tags')">✕</button></div>
  <div class="panel-body">
    <div class="tag-input-row">
      <input id="new-tag-name" placeholder="태그 이름" type="text">
      <input type="color" id="new-tag-color" value="#4A90D9">
      <button class="btn-add" onclick="TagMgr.createTag()">추가</button>
    </div>
    <div id="tag-list-panel"></div>
  </div>
</div>

<!-- 노트 태그 선택 패널 -->
<div id="panel-note-tags" class="panel hidden">
  <div class="panel-header"><span>태그 선택</span><button onclick="UI.closePanel('panel-note-tags')">✕</button></div>
  <div id="note-tag-list" class="panel-body"></div>
</div>

<!-- 에디터 폰트 크기 패널 -->
<div id="panel-font" class="panel hidden">
  <div class="panel-header"><span>에디터 글자 크기</span><button onclick="UI.closePanel('panel-font')">✕</button></div>
  <div class="panel-body">
    <div class="font-size-row">
      <input type="range" min="12" max="24" step="1" id="editor-font-size"
             oninput="Editor.setFontSize(this.value)" onchange="Editor.setFontSize(this.value)">
      <span id="editor-font-size-label">16px</span>
    </div>
  </div>
</div>

<!-- 더보기 메뉴 패널 -->
<div id="panel-more" class="panel hidden">
  <div class="panel-header"><span>메뉴</span><button onclick="UI.closePanel('panel-more')">✕</button></div>
  <div class="panel-body">
    <!-- 목록 글자 크기 -->
    <div class="more-section-label">목록 글자 크기</div>
    <div class="more-font-row">
      <button class="more-font-btn" onclick="ListFont.dec()">A−</button>
      <span id="more-font-label">18</span>
      <button class="more-font-btn" onclick="ListFont.inc()">A+</button>
    </div>

    <!-- 태그 필터 -->
    <div class="more-section-label" style="margin-top:18px">태그 필터</div>
    <div id="more-tag-chips" class="more-tag-row"></div>

    <!-- 기타 -->
    <div class="more-action-row" onclick="UI.openTagManager();UI.closePanel('panel-more')">
      🏷 태그 관리
    </div>
    <div class="more-action-row" onclick="UI.openSettings();UI.closePanel('panel-more')">
      ⚙ 설정
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden" onclick="UI.closeAllPanels()"></div>

<script src="js/db.js"></script>
<script src="js/settings.js"></script>
<script src="js/list.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
